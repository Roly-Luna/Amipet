<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion | AmiPet</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../../index.html">AmiPet</a>
      <nav class="site-nav" aria-label="Navegacion principal">
        <a href="../adopcion/catalogo.html">Adoptar</a>
        <a href="../../index.html">Inicio</a>
      </nav>
    </div>
  </header>
  <main class="container section">
    <section class="card auth-card" aria-labelledby="login-title">
      <span class="eyebrow">Bienvenido de nuevo</span>
      <h1 id="login-title">Inicia sesion</h1>
      <p>Ingresa tus datos para continuar en AmiPet.</p>
      <form class="auth-form" action="#" method="get">
        <div class="form-field">
          <label class="form-field__label" for="email">Correo electronico</label>
          <input class="form-field__control" id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-field__label" for="password">Contrasena</label>
          <input class="form-field__control" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <button class="button button--primary button--block" type="submit">Iniciar sesion</button>
      </form>
      <p>¿No tienes una cuenta? <a href="registro.html">Registrate</a></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>AmiPet - Adopcion responsable</p></div></footer>
</body>
</html>
